<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arthood Team & Work</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">

<style>

body{
font-family: Arial, sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
text-align:center;
}

.header{
background:#0f766e;
color:white;
padding:20px;
}

.logo{
width:140px;
margin-bottom:10px;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input{
width:90%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:90%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.checkin{
background:#16a34a;
color:white;
}

.checkout{
background:#dc2626;
color:white;
}

.otp{
background:#0f766e;
color:white;
}

.adminbtn{
background:#333;
color:white;
}

.table-container{
overflow-x:auto;
width:100%;
}

table{
min-width:500px;
border-collapse:collapse;
}

th,td{
padding:10px;
border:1px solid #ddd;
font-size:14px;
}

</style>

</head>

<body>

<div class="header">

<img src="logo.png" class="logo">

<h2>Arthood Team & Work</h2>

</div>

<div class="container">

<div class="card">

<h3>Staff Login</h3>

<input id="phone" placeholder="+91 phone number">

<button class="otp" onclick="sendOTP()">Send OTP</button>

<input id="otp" placeholder="Enter OTP">

<button class="otp" onclick="verifyOTP()">Verify OTP</button>

</div>

<div id="staffSection" class="card" style="display:none;">

<h3>Attendance</h3>

<button id="checkInBtn" class="checkin" onclick="checkIn()">Check In</button>

<button id="checkOutBtn" class="checkout" onclick="checkOut()">Check Out</button>

</div>

<div id="adminSection" class="card" style="display:none;">

<h3>Admin Dashboard</h3>

<button class="adminbtn" onclick="loadAttendance()">Refresh</button>

<h4>Attendance Log</h4>

<div class="table-container">

<table id="attendanceTable">

<thead>

<tr>
<th>Phone</th>
<th>Check In</th>
<th>Check Out</th>
<th>Hours</th>
</tr>

</thead>

<tbody></tbody>

</table>

</div>

<h4>Monthly Salary</h4>

<div class="table-container">

<table id="salaryTable">

<thead>

<tr>
<th>Phone</th>
<th>Total Hours</th>
<th>Salary</th>
</tr>

</thead>

<tbody></tbody>

</table>

</div>

</div>

</div>

<script>

const { createClient } = supabase

const supabaseUrl = "https://lnkzzuvobybtaptxnpqn.supabase.co"
const supabaseKey = "YOUR_ANON_KEY"

const ADMIN_PHONE="+919008612401"

const client=createClient(supabaseUrl,supabaseKey)

window.onload=async function(){

const {data}=await client.auth.getSession()

if(data.session){

document.getElementById("staffSection").style.display="block"

if(data.session.user.phone===ADMIN_PHONE){

document.getElementById("adminSection").style.display="block"

loadAttendance()

}

updateAttendanceStatus()

}

}

async function sendOTP(){

const phone=document.getElementById("phone").value

const {error}=await client.auth.signInWithOtp({phone})

if(error)alert(error.message)
else alert("OTP Sent")

}

async function verifyOTP(){

const phone=document.getElementById("phone").value
const otp=document.getElementById("otp").value

const {error}=await client.auth.verifyOtp({

phone,
token:otp,
type:"sms"

})

if(error){

alert("Verification Failed")

return

}

alert("Login Successful")

document.getElementById("staffSection").style.display="block"

if(phone===ADMIN_PHONE){

document.getElementById("adminSection").style.display="block"

loadAttendance()

}

updateAttendanceStatus()

}

async function getCurrentStaff(){

const {data:userData}=await client.auth.getUser()

if(!userData.user)return null

const {data:staff}=await client

.from("staff")
.select("id,store_id")
.eq("auth_user_id",userData.user.id)
.maybeSingle()

return staff

}

async function updateAttendanceStatus(){

const staff=await getCurrentStaff()

if(!staff)return

const {data}=await client

.from("attendance")
.select("id")
.eq("staff_id",staff.id)
.is("check_out",null)
.maybeSingle()

const checkInBtn=document.getElementById("checkInBtn")
const checkOutBtn=document.getElementById("checkOutBtn")

if(data){

checkInBtn.disabled=true
checkOutBtn.disabled=false

}else{

checkInBtn.disabled=false
checkOutBtn.disabled=true

}

}

async function checkIn(){

const staff=await getCurrentStaff()

if(!staff)return alert("Staff not found")

navigator.geolocation.getCurrentPosition(async pos=>{

const lat=pos.coords.latitude
const lng=pos.coords.longitude

const {error}=await client

.from("attendance")
.insert([{

staff_id:staff.id,
store_id:staff.store_id,
check_in:new Date().toISOString(),
latitude:lat,
longitude:lng

}])

if(error)alert(error.message)
else{

alert("Check In Successful")

updateAttendanceStatus()

}

})

}

async function checkOut(){

const staff=await getCurrentStaff()

if(!staff)return alert("Staff not found")

const {data:attendance}=await client

.from("attendance")
.select("id,check_in")
.eq("staff_id",staff.id)
.is("check_out",null)
.maybeSingle()

if(!attendance)return alert("No active checkin")

const now=new Date()

const diff=(now-new Date(attendance.check_in))/(1000*60*60)

const {error}=await client

.from("attendance")
.update({

check_out:now.toISOString(),
total_hours:diff.toFixed(2)

})
.eq("id",attendance.id)

if(error)alert(error.message)

else{

alert("Check Out Successful")

updateAttendanceStatus()

}

}

async function loadAttendance(){

const {data}=await client

.from("attendance")
.select(`

check_in,
check_out,
total_hours,
staff:staff_id(phone)

`)
.order("check_in",{ascending:false})

const tbody=document.querySelector("#attendanceTable tbody")

tbody.innerHTML=""

data.forEach(r=>{

const tr=document.createElement("tr")

tr.innerHTML=`

<td>${r.staff?.phone||""}</td>
<td>${r.check_in||""}</td>
<td>${r.check_out||""}</td>
<td>${r.total_hours||""}</td>

`

tbody.appendChild(tr)

})

loadMonthlySalary()

}

async function loadMonthlySalary(){

const start=new Date()

start.setDate(1)

const {data}=await client

.from("attendance")
.select(`

total_hours,
staff:staff_id(phone)

`)
.gte("check_in",start.toISOString())
.not("total_hours","is",null)

const summary={}

data.forEach(r=>{

const phone=r.staff?.phone
const hours=parseFloat(r.total_hours)

if(!summary[phone])summary[phone]=0

summary[phone]+=hours

})

const tbody=document.querySelector("#salaryTable tbody")

tbody.innerHTML=""

Object.keys(summary).forEach(phone=>{

const hrs=summary[phone]

const salary=hrs*56

const tr=document.createElement("tr")

tr.innerHTML=`

<td>${phone}</td>
<td>${hrs.toFixed(2)}</td>
<td>₹${salary.toFixed(2)}</td>

`

tbody.appendChild(tr)

})

}

</script>

<script>

if("serviceWorker" in navigator){

navigator.serviceWorker.register("/service-worker.js")

}

</script>

</body>
</html>
