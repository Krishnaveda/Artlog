<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Arthood Team & Work</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f766e">

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
padding:0;
text-align:center;
}

.header{
background:#0f766e;
color:white;
padding:20px;
}

.logo{
width:120px;
margin-bottom:10px;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
width:90%;
padding:12px;
margin:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
padding:14px 20px;
border:none;
border-radius:10px;
font-size:16px;
margin:10px;
cursor:pointer;
}

.primary{
background:#0f766e;
color:white;
}

.checkin{
background:#22c55e;
color:white;
font-size:18px;
width:80%;
}

.checkout{
background:#ef4444;
color:white;
font-size:18px;
width:80%;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
font-size:14px;
}

</style>

</head>

<body>

<div class="header">

<img src="logo.png" class="logo">

<h2>Arthood Team & Work</h2>

</div>

<div class="card">

<h3>Staff Login</h3>

<input id="phone" placeholder="+919008612401">

<br>

<button class="primary" onclick="sendOTP()">Send OTP</button>

<br>

<input id="otp" placeholder="Enter OTP">

<br>

<button class="primary" onclick="verifyOTP()">Verify OTP</button>

</div>

<div id="staffSection" class="card" style="display:none;">

<h3>Attendance</h3>

<button id="checkInBtn" class="checkin" onclick="checkIn()">Check In</button>

<br>

<button id="checkOutBtn" class="checkout" onclick="checkOut()">Check Out</button>

</div>

<div id="adminSection" class="card" style="display:none;">

<h3>Admin Dashboard</h3>

<button class="primary" onclick="loadAttendance()">Refresh Attendance</button>

<br><br>

<table id="attendanceTable">

<thead>

<tr>

<th>Phone</th>

<th>Check In</th>

<th>Check Out</th>

<th>Hours</th>

</tr>

</thead>

<tbody></tbody>

</table>

<br><br>

<h3>Monthly Salary</h3>

<table id="salaryTable">

<thead>

<tr>

<th>Phone</th>

<th>Total Hours</th>

<th>Salary ₹56/hr</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

<script>

const { createClient } = supabase;

const supabaseUrl = "https://lnkzzuvobybtaptxnpqn.supabase.co";

const supabaseKey = "YOUR_KEY";

const ADMIN_PHONE = "+919008612401";

const client = createClient(supabaseUrl, supabaseKey);

window.onload = async function(){

const { data } = await client.auth.getSession();

if(data.session){

document.getElementById("staffSection").style.display="block";

if(data.session.user.phone===ADMIN_PHONE){

document.getElementById("adminSection").style.display="block";

loadAttendance();

}

updateAttendanceStatus();

}

}

async function sendOTP(){

const phone=document.getElementById("phone").value;

const {error}=await client.auth.signInWithOtp({phone});

if(error) alert(error.message);

else alert("OTP Sent");

}

async function verifyOTP(){

const phone=document.getElementById("phone").value;

const otp=document.getElementById("otp").value;

const {error}=await client.auth.verifyOtp({

phone,

token:otp,

type:"sms"

});

if(error){

alert(error.message);

return;

}

alert("Login Successful");

document.getElementById("staffSection").style.display="block";

if(phone===ADMIN_PHONE){

document.getElementById("adminSection").style.display="block";

loadAttendance();

}

updateAttendanceStatus();

}

async function getCurrentStaff(){

const {data:userData}=await client.auth.getUser();

const {data}=await client

.from("staff")

.select("id,store_id")

.eq("auth_user_id",userData.user.id)

.maybeSingle();

return data;

}

async function updateAttendanceStatus(){

const staff=await getCurrentStaff();

const {data}=await client

.from("attendance")

.select("id")

.eq("staff_id",staff.id)

.is("check_out",null)

.maybeSingle();

const inBtn=document.getElementById("checkInBtn");

const outBtn=document.getElementById("checkOutBtn");

if(data){

inBtn.disabled=true;

outBtn.disabled=false;

}else{

inBtn.disabled=false;

outBtn.disabled=true;

}

}

async function checkIn(){

navigator.geolocation.getCurrentPosition(async function(pos){

const lat=pos.coords.latitude;

const lng=pos.coords.longitude;

const staff=await getCurrentStaff();

await client.from("attendance").insert([{

staff_id:staff.id,

store_id:staff.store_id,

check_in:new Date().toISOString(),

lat,

lng

}]);

alert("Checked In");

updateAttendanceStatus();

});

}

async function checkOut(){

const staff=await getCurrentStaff();

const {data:attendance}=await client

.from("attendance")

.select("id,check_in")

.eq("staff_id",staff.id)

.is("check_out",null)

.maybeSingle();

const now=new Date();

const diff=(now-new Date(attendance.check_in))/(1000*60*60);

await client.from("attendance")

.update({

check_out:now.toISOString(),

total_hours:diff.toFixed(2)

})

.eq("id",attendance.id);

alert("Checked Out");

updateAttendanceStatus();

}

async function loadAttendance(){

const {data}=await client

.from("attendance")

.select(`

check_in,

check_out,

total_hours,

staff:staff_id(phone)

`)

.order("check_in",{ascending:false});

const tbody=document.querySelector("#attendanceTable tbody");

tbody.innerHTML="";

data.forEach(r=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${r.staff?.phone}</td>

<td>${r.check_in||""}</td>

<td>${r.check_out||""}</td>

<td>${r.total_hours||""}</td>

`;

tbody.appendChild(tr);

});

}

</script>

<script>

if('serviceWorker' in navigator){

navigator.serviceWorker.register('/service-worker.js');

}

</script>

</body>

</html>
